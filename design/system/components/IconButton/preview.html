<!-- @dsCard group="Actions" height=220 subtitle="Icon buttons: menú ⋮, botones de formato y el lápiz pequeño junto a un nombre." width=960 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-sans);color:var(--on-surface);background:var(--surface)}
.wrap{padding:16px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:96px repeat(5,minmax(150px,1fr));gap:12px 12px;align-items:center;justify-items:start}
.h{font-size:11px;font-weight:500;line-height:16px;letter-spacing:.5px;color:var(--on-surface-variant);text-transform:uppercase}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.sl{position:relative;overflow:hidden}
.sl::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;border-radius:inherit;pointer-events:none}
.hover::after{opacity:var(--state-hover)}
.focus::after{opacity:var(--state-focus)}
.press::after{opacity:var(--state-pressed)}
.focus{outline:3px solid var(--secondary);outline-offset:2px}
.note{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--on-surface-variant);margin:0}
button{font:inherit;margin:0;border:none;background:none;padding:0;cursor:pointer;color:inherit}
.ib{width:48px;height:48px;border-radius:var(--corner-full);display:inline-flex;align-items:center;justify-content:center;color:var(--on-surface-variant)}.ib.on{background:var(--secondary-container);color:var(--on-secondary-container)}.ib.dis{color:color-mix(in srgb,var(--on-surface) calc(var(--disabled-content)*100%),transparent);background:none}</style>
</head>
<body>
<div class="wrap">
<div class="grid"><span></span><span class="h">Enabled</span><span class="h">Hover</span><span class="h">Focused</span><span class="h">Pressed</span><span class="h">Disabled</span><span class="h">Standard</span><button class="ib sl " ><span class="ms">more_vert</span></button><button class="ib sl hover" ><span class="ms">more_vert</span></button><button class="ib sl focus" ><span class="ms">more_vert</span></button><button class="ib sl press" ><span class="ms">more_vert</span></button><button class="ib sl dis" disabled><span class="ms">more_vert</span></button><span class="h">Toggle on</span><button class="ib sl on " ><span class="ms">format_bold</span></button><button class="ib sl on hover" ><span class="ms">format_bold</span></button><button class="ib sl on focus" ><span class="ms">format_bold</span></button><button class="ib sl on press" ><span class="ms">format_bold</span></button><button class="ib sl on dis" disabled><span class="ms">format_bold</span></button><span class="h">Small (16)</span><button class="ib sl " ><span class="ms" style="font-size:16px">edit</span></button><button class="ib sl hover" ><span class="ms" style="font-size:16px">edit</span></button><button class="ib sl focus" ><span class="ms" style="font-size:16px">edit</span></button><button class="ib sl press" ><span class="ms" style="font-size:16px">edit</span></button><button class="ib sl dis" disabled><span class="ms" style="font-size:16px">edit</span></button></div>
</div>
<script>/* static preview */</script>
</body>
</html>
