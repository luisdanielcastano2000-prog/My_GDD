<!-- @dsCard group="Actions" height=230 subtitle="FAB extendido para crear y FAB de icono en el editor." width=960 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-sans);color:var(--on-surface);background:var(--surface)}
.wrap{padding:16px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:96px repeat(5,minmax(150px,1fr));gap:12px 12px;align-items:center;justify-items:start}
.h{font-size:11px;font-weight:500;line-height:16px;letter-spacing:.5px;color:var(--on-surface-variant);text-transform:uppercase}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.sl{position:relative;overflow:hidden}
.sl::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;border-radius:inherit;pointer-events:none}
.hover::after{opacity:var(--state-hover)}
.focus::after{opacity:var(--state-focus)}
.press::after{opacity:var(--state-pressed)}
.focus{outline:3px solid var(--secondary);outline-offset:2px}
.note{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--on-surface-variant);margin:0}
button{font:inherit;margin:0;border:none;background:none;padding:0;cursor:pointer;color:inherit}
.fab{height:56px;padding:0 20px 0 16px;border-radius:var(--corner-large);background:var(--primary-container);color:var(--on-primary-container);display:inline-flex;align-items:center;gap:12px;font-size:16px;font-weight:500;line-height:24px;letter-spacing:.15px;box-shadow:var(--elevation-3)}.fab.sq{width:56px;padding:0;justify-content:center}.fab.dis{background:color-mix(in srgb,var(--on-surface) calc(var(--disabled-container)*100%),transparent);color:color-mix(in srgb,var(--on-surface) calc(var(--disabled-content)*100%),transparent);box-shadow:none}</style>
</head>
<body>
<div class="wrap">
<div class="grid"><span></span><span class="h">Enabled</span><span class="h">Hover</span><span class="h">Focused</span><span class="h">Pressed</span><span class="h">Disabled</span><span class="h">Extended</span><button class="fab sl " ><span class="ms">add</span>New GDD</button><button class="fab sl hover" ><span class="ms">add</span>New GDD</button><button class="fab sl focus" ><span class="ms">add</span>New GDD</button><button class="fab sl press" ><span class="ms">add</span>New GDD</button><button class="fab sl dis" disabled><span class="ms">add</span>New GDD</button><span class="h">Icon</span><button class="fab sq sl " ><span class="ms">check</span></button><button class="fab sq sl hover" ><span class="ms">check</span></button><button class="fab sq sl focus" ><span class="ms">check</span></button><button class="fab sq sl press" ><span class="ms">check</span></button><button class="fab sq sl dis" disabled><span class="ms">check</span></button></div>
</div>
<script>/* static preview */</script>
</body>
</html>
