<!-- @dsCard group="Selection" height=170 subtitle="Interruptor para ajustes que se aplican al momento." width=960 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-sans);color:var(--on-surface);background:var(--surface)}
.wrap{padding:16px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:96px repeat(5,minmax(150px,1fr));gap:12px 12px;align-items:center;justify-items:start}
.h{font-size:11px;font-weight:500;line-height:16px;letter-spacing:.5px;color:var(--on-surface-variant);text-transform:uppercase}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.sl{position:relative;overflow:hidden}
.sl::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;border-radius:inherit;pointer-events:none}
.hover::after{opacity:var(--state-hover)}
.focus::after{opacity:var(--state-focus)}
.press::after{opacity:var(--state-pressed)}
.focus{outline:3px solid var(--secondary);outline-offset:2px}
.note{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--on-surface-variant);margin:0}
button{font:inherit;margin:0;border:none;background:none;padding:0;cursor:pointer;color:inherit}
.sw{width:52px;height:32px;box-sizing:border-box;border-radius:var(--corner-full);border:2px solid var(--outline);background:var(--surface-container-highest);display:inline-flex;align-items:center;padding:0 6px;overflow:visible}.sw .k{border-radius:50%;background:var(--outline)}.sw.on{background:var(--primary);border-color:var(--primary);justify-content:flex-end;padding:0 2px}.sw.on .k{background:var(--on-primary)}.sw.dis{opacity:.38}.sw::after{display:none}.sw.hover,.sw.press{box-shadow:0 0 0 8px color-mix(in srgb,var(--on-surface) calc(var(--state-hover)*100%),transparent)}</style>
</head>
<body>
<div class="wrap">
<div class="grid"><span></span><span class="h">Enabled</span><span class="h">Hover</span><span class="h">Focused</span><span class="h">Pressed</span><span class="h">Disabled</span><span class="h">On</span><button class="sw sl  on" role="switch" aria-checked="true"><span class="k" style="width:24px;height:24px"></span></button><button class="sw sl hover on" role="switch" aria-checked="true"><span class="k" style="width:24px;height:24px"></span></button><button class="sw sl focus on" role="switch" aria-checked="true"><span class="k" style="width:24px;height:24px"></span></button><button class="sw sl press on" role="switch" aria-checked="true"><span class="k" style="width:24px;height:24px"></span></button><button class="sw sl dis on" role="switch" aria-checked="true"><span class="k" style="width:24px;height:24px"></span></button><span class="h">Off</span><button class="sw sl  " role="switch" aria-checked="false"><span class="k" style="width:16px;height:16px"></span></button><button class="sw sl hover " role="switch" aria-checked="false"><span class="k" style="width:16px;height:16px"></span></button><button class="sw sl focus " role="switch" aria-checked="false"><span class="k" style="width:16px;height:16px"></span></button><button class="sw sl press " role="switch" aria-checked="false"><span class="k" style="width:16px;height:16px"></span></button><button class="sw sl dis " role="switch" aria-checked="false"><span class="k" style="width:16px;height:16px"></span></button></div>
</div>
<script>/* static preview */</script>
</body>
</html>
