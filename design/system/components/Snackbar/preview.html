<!-- @dsCard group="Feedback" height=200 subtitle="Snackbar de confirmación (✓ OK), neutro con Undo y de error (× Error) con Retry." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-sans);color:var(--on-surface);background:var(--surface)}
.wrap{padding:16px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:96px repeat(5,minmax(0,1fr));gap:12px 12px;align-items:center;justify-items:start}
.h{font-size:11px;font-weight:500;line-height:16px;letter-spacing:.5px;color:var(--on-surface-variant);text-transform:uppercase}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.sl{position:relative;overflow:hidden}
.sl::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;border-radius:inherit;pointer-events:none}
.hover::after{opacity:var(--state-hover)}
.focus::after{opacity:var(--state-focus)}
.press::after{opacity:var(--state-pressed)}
.focus{outline:3px solid var(--secondary);outline-offset:2px}
.note{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--on-surface-variant);margin:0}
button{font:inherit;margin:0;border:none;background:none;padding:0;cursor:pointer;color:inherit}
.sn{min-height:48px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:4px 8px 4px 16px;border-radius:var(--corner-extra-small);background:var(--inverse-surface);color:var(--inverse-on-surface);font-size:14px;letter-spacing:.25px;box-shadow:var(--elevation-3)}.ac2{height:40px;padding:0 12px;color:var(--inverse-primary);font-size:14px;font-weight:500}.sn.ok{background:var(--exito-suave);color:var(--on-surface)}.sn.er{background:var(--error-suave);color:var(--on-surface)}.sn.er .ac2{color:var(--error)}.msg{display:flex;align-items:center;gap:8px;padding:8px 0}.lbl{display:inline-flex;align-items:center;gap:4px;height:20px;box-sizing:border-box;padding:0 6px;border-radius:var(--corner-extra-small);font-family:'Roboto Mono',ui-monospace,monospace;font-size:11px;font-weight:700;line-height:16px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;flex:none}.lbl.av{background:var(--aviso);color:var(--on-aviso)}.lbl.ok{background:var(--exito);color:var(--on-exito)}.lbl.er{background:var(--error-container);color:var(--on-error-container)}.lbl.sym{width:20px;padding:0;justify-content:center}</style>
</head>
<body>
<div class="wrap">
<div style="display:flex;flex-direction:column;gap:12px;width:358px"><div class="sn ok" role="status"><span class="msg"><span class="lbl ok"><span aria-hidden="true">✓</span>OK</span>Blockings reviewed · Up to date</span></div><div class="sn">Blockings deleted<button class="ac2">Undo</button></div><div class="sn er" role="alert"><span class="msg"><span class="lbl er"><span aria-hidden="true">×</span>Error</span>Your change couldn’t be saved.</span><button class="ac2">Retry</button></div></div>
</div>
<script>/* static preview */</script>
</body>
</html>
