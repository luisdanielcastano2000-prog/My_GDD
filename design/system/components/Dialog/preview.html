<!-- @dsCard group="Feedback" height=300 subtitle="Dialogs de renombrar y de confirmar un borrado." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-sans);color:var(--on-surface);background:var(--surface)}
.wrap{padding:16px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:96px repeat(5,minmax(0,1fr));gap:12px 12px;align-items:center;justify-items:start}
.h{font-size:11px;font-weight:500;line-height:16px;letter-spacing:.5px;color:var(--on-surface-variant);text-transform:uppercase}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.sl{position:relative;overflow:hidden}
.sl::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;border-radius:inherit;pointer-events:none}
.hover::after{opacity:var(--state-hover)}
.focus::after{opacity:var(--state-focus)}
.press::after{opacity:var(--state-pressed)}
.focus{outline:3px solid var(--secondary);outline-offset:2px}
.note{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--on-surface-variant);margin:0}
button{font:inherit;margin:0;border:none;background:none;padding:0;cursor:pointer;color:inherit}
.tf{position:relative;width:100%}.tf label{position:absolute;left:12px;top:-8px;padding:0 4px;background:var(--surface-container-high);font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--on-surface-variant)}.tf .in{height:56px;box-sizing:border-box;border:1px solid var(--outline);border-radius:var(--corner-extra-small);padding:0 16px;display:flex;align-items:center;font-size:16px;letter-spacing:.5px}.tf.focus{outline:none}.tf.focus .in{border:2px solid var(--primary)}.tf.focus label{color:var(--primary)}.tf.hover .in{border-color:var(--on-surface)}.tf.err .in{border:2px solid var(--error)}.tf.err label{color:var(--error)}.tf.dis .in{border-color:color-mix(in srgb,var(--on-surface) calc(var(--disabled-container)*100%),transparent);color:color-mix(in srgb,var(--on-surface) calc(var(--disabled-content)*100%),transparent)}.tf.dis label{color:color-mix(in srgb,var(--on-surface) calc(var(--disabled-content)*100%),transparent)}.sup{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--on-surface-variant);padding:4px 16px 0}.err .sup{color:var(--error)}.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 16px;margin-top:8px}.dg{width:280px;box-sizing:border-box;padding:24px 24px 20px;border-radius:var(--corner-extra-large);background:var(--surface-container-high);display:flex;flex-direction:column;gap:16px}.dg h2{margin:0;font-size:24px;font-weight:400;line-height:32px}.dg p{margin:0;font-size:14px;line-height:20px;letter-spacing:.25px;color:var(--on-surface-variant)}.ac{display:flex;justify-content:flex-end;gap:8px}.tb{height:40px;padding:0 12px;border-radius:20px;color:var(--primary);font-size:14px;font-weight:500}.tb.red{color:var(--error)}</style>
</head>
<body>
<div class="wrap">
<div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap"><div class="dg"><h2>Rename project</h2><div class="tf focus"><label>Project name</label><div class="in">Hollow Tides</div></div><div class="ac"><button class="tb">Cancel</button><button class="tb">Save</button></div></div><div class="dg"><h2>Delete Hollow Tides?</h2><p>Its 10 departments and 40 blocks will be deleted. You can’t undo this.</p><div class="ac"><button class="tb">Cancel</button><button class="tb red">Delete</button></div></div></div>
</div>
<script>/* static preview */</script>
</body>
</html>
