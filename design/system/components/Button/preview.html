<!-- @dsCard group="Actions" height=340 subtitle="Botones de M3 Expressive: filled, tonal, outlined y text, en sus cinco estados." width=960 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-sans);color:var(--on-surface);background:var(--surface)}
.wrap{padding:16px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:96px repeat(5,minmax(150px,1fr));gap:12px 12px;align-items:center;justify-items:start}
.h{font-size:11px;font-weight:500;line-height:16px;letter-spacing:.5px;color:var(--on-surface-variant);text-transform:uppercase}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.sl{position:relative;overflow:hidden}
.sl::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;border-radius:inherit;pointer-events:none}
.hover::after{opacity:var(--state-hover)}
.focus::after{opacity:var(--state-focus)}
.press::after{opacity:var(--state-pressed)}
.focus{outline:3px solid var(--secondary);outline-offset:2px}
.note{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--on-surface-variant);margin:0}
button{font:inherit;margin:0;border:none;background:none;padding:0;cursor:pointer;color:inherit}

.btn{height:40px;padding:0 16px;border-radius:var(--corner-full);display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;line-height:20px;letter-spacing:.1px;white-space:nowrap}
.filled{background:var(--primary);color:var(--on-primary)}
.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.outlined{border:1px solid var(--outline-variant);color:var(--on-surface-variant)}
.text{color:var(--primary);padding:0 12px}
.btn.dis{background:color-mix(in srgb,var(--on-surface) calc(var(--disabled-container)*100%),transparent);color:color-mix(in srgb,var(--on-surface) calc(var(--disabled-content)*100%),transparent);border-color:color-mix(in srgb,var(--on-surface) calc(var(--disabled-container)*100%),transparent);cursor:default}
.text.dis,.outlined.dis{background:none}
.m{height:56px;padding:0 24px;font-size:16px;line-height:24px;letter-spacing:.15px}
</style>
</head>
<body>
<div class="wrap">
<div class="grid"><span></span><span class="h">Enabled</span><span class="h">Hover</span><span class="h">Focused</span><span class="h">Pressed</span><span class="h">Disabled</span><span class="h">Filled</span><button class="btn sl filled  " >Open</button><button class="btn sl filled  hover" >Open</button><button class="btn sl filled  focus" >Open</button><button class="btn sl filled  press" >Open</button><button class="btn sl filled  dis" disabled>Open</button><span class="h">Tonal</span><button class="btn sl tonal  " ><span class="ms">add</span>Block</button><button class="btn sl tonal  hover" ><span class="ms">add</span>Block</button><button class="btn sl tonal  focus" ><span class="ms">add</span>Block</button><button class="btn sl tonal  press" ><span class="ms">add</span>Block</button><button class="btn sl tonal  dis" disabled><span class="ms">add</span>Block</button><span class="h">Outlined</span><button class="btn sl outlined  " >Note a change</button><button class="btn sl outlined  hover" >Note a change</button><button class="btn sl outlined  focus" >Note a change</button><button class="btn sl outlined  press" >Note a change</button><button class="btn sl outlined  dis" disabled>Note a change</button><span class="h">Text</span><button class="btn sl text  " >Retry</button><button class="btn sl text  hover" >Retry</button><button class="btn sl text  focus" >Retry</button><button class="btn sl text  press" >Retry</button><button class="btn sl text  dis" disabled>Retry</button></div><div style="display:flex;gap:12px;align-items:center;margin-top:8px"><button class="btn sl filled m">Create GDD</button><p class="note">Tamaño M (56 px) para la acción principal de cada pantalla; tamaño S (40 px, en una zona táctil de 48) para el resto.</p></div>
</div>
<script>/* static preview */</script>
</body>
</html>
