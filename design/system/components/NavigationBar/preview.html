<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-sans);color:var(--on-surface);background:var(--surface)}
.wrap{padding:16px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:96px repeat(5,minmax(0,1fr));gap:12px 12px;align-items:center;justify-items:start}
.h{font-size:11px;font-weight:500;line-height:16px;letter-spacing:.5px;color:var(--on-surface-variant);text-transform:uppercase}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.sl{position:relative;overflow:hidden}
.sl::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;border-radius:inherit;pointer-events:none}
.hover::after{opacity:var(--state-hover)}
.focus::after{opacity:var(--state-focus)}
.press::after{opacity:var(--state-pressed)}
.focus{outline:3px solid var(--secondary);outline-offset:2px}
.note{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--on-surface-variant);margin:0}
button{font:inherit;margin:0;border:none;background:none;padding:0;cursor:pointer;color:inherit}
.nb{width:390px;height:80px;box-sizing:border-box;display:flex;padding:12px 8px 16px;background:var(--surface-container)}.it{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}.ind{position:relative;width:56px;height:32px;border-radius:var(--corner-full);display:flex;align-items:center;justify-content:center;color:var(--on-surface-variant)}.ind.on{background:var(--secondary-container);color:var(--on-secondary-container)}.lb{font-size:12px;font-weight:500;letter-spacing:.5px;color:var(--on-surface-variant)}.lb.on{color:var(--secondary)}.bd{position:absolute;top:-2px;left:30px;min-width:16px;height:16px;box-sizing:border-box;padding:0 4px;border-radius:8px;background:var(--error-container);color:var(--on-error-container);font-size:11px;font-weight:500;line-height:16px;text-align:center}</style>
</head>
<body>
<div class="wrap">
<div class="nb"><span class="it"><span class="ind on"><span class="ms fill">home</span></span><span class="lb on">Home</span></span><span class="it"><span class="ind"><span class="ms">sticky_note_2</span><span class="bd">2</span></span><span class="lb">Notes</span></span><span class="it"><span class="ind"><span class="ms">help</span></span><span class="lb">Help</span></span></div>
</div>
<script>/* static preview */</script>
</body>
</html>
